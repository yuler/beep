beep_poller: &beep_poller
  class: BeepPollerJob
  schedule: every 10 seconds

beeper_poller: &beeper_poller
  class: BeeperPollerJob
  schedule: every 10 seconds

runner_job_poller: &runner_job_poller
  class: RunnerJobPollerJob
  schedule: every 10 seconds

development:
  beep_poller:
    <<: *beep_poller
  beeper_poller:
    <<: *beeper_poller
  runner_job_poller:
    <<: *runner_job_poller

test:
  beep_poller:
    <<: *beep_poller
  beeper_poller:
    <<: *beeper_poller
  runner_job_poller:
    <<: *runner_job_poller

production:
  beep_poller:
    <<: *beep_poller
  beeper_poller:
    <<: *beeper_poller
  runner_job_poller:
    <<: *runner_job_poller
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every day at 00:00
