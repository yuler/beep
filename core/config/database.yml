default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

# Local `mise` loads root `.env`, which sets DB_NAME* for Docker Compose /
# production. Development and test must not honor those, or Solid Queue and
# other multi-db tables resolve to empty production_*.sqlite3 files.
development:
  primary:
    <<: *default
    database: storage/development.sqlite3
    schema_dump: schema.rb
  queue:
    <<: *default
    database: storage/development_queue.sqlite3
    migrations_paths: db/queue_migrate
    schema_dump: queue_schema.rb
  cable:
    <<: *default
    database: storage/development_cable.sqlite3
    migrations_paths: db/cable_migrate
    schema_dump: cable_schema.rb

test:
  primary:
    <<: *default
    database: <%= ENV.fetch("DB_NAME_TEST", "storage/test.sqlite3") %>
    schema_dump: schema.rb
  queue:
    <<: *default
    database: <%= ENV.fetch("DB_NAME_QUEUE_TEST", "storage/test_queue.sqlite3") %>
    migrations_paths: db/queue_migrate
    schema_dump: queue_schema.rb
  cable:
    <<: *default
    database: <%= ENV.fetch("DB_NAME_CABLE_TEST", "storage/test_cable.sqlite3") %>
    migrations_paths: db/cable_migrate
    schema_dump: cable_schema.rb

production:
  primary:
    <<: *default
    database: <%= ENV.fetch("DB_NAME", "storage/production.sqlite3") %>
    schema_dump: schema.rb
  cache:
    <<: *default
    database: <%= ENV.fetch("DB_NAME_CACHE", "storage/production_cache.sqlite3") %>
    migrations_paths: db/cache_migrate
    schema_dump: cache_schema.rb
  queue:
    <<: *default
    database: <%= ENV.fetch("DB_NAME_QUEUE", "storage/production_queue.sqlite3") %>
    migrations_paths: db/queue_migrate
    schema_dump: queue_schema.rb
  cable:
    <<: *default
    database: <%= ENV.fetch("DB_NAME_CABLE", "storage/production_cable.sqlite3") %>
    migrations_paths: db/cable_migrate
    schema_dump: cable_schema.rb
