[tools]
ruby = "3.4.7"
node = "24.17.0"
pnpm = "10.14.0"
go = "1.25.0"
gum = "0.17.0"
overmind = "2.5.1"
tmux = "3.7b"

[env]
# `.env` then `.env.local` (later file wins).
_.file = [".env", ".env.local"]
# Overmind Overload()'s `.env` and would wipe `.env.local` (empty VITE_CORE_URL=).
OVERMIND_SKIP_ENV = "1"

[tasks.setup]
description = "Set up the development environment (gems, deps, db)"
run = "bash scripts/setup.sh"

[tasks.clean]
description = "Clean logs, caches and local env files (interactive)"
run = "bash scripts/clean.sh"

[tasks."core:dev"]
description = "Start the Rails development server"
dir = "core"
env = { RUBY_DEBUG_OPEN = "true", RUBY_DEBUG_LAZY = "true" }
run = "bin/rails server -p ${CORE_PORT}"

[tasks."core:console"]
description = "Open the Rails console"
dir = "core"
run = "bin/rails console"

[tasks."core:console:production"]
description = "Open the Rails console in the production container"
run = "bash scripts/rails-console-production.sh"

[tasks."web:dev"]
description = "Start the Vite development server"
dir = "apps/web"
run = "pnpm run dev -- --port ${WEB_PORT}"

[tasks."web:build"]
description = "Build the web app for production"
dir = "apps/web"
run = "pnpm run build"

[tasks."runner:build"]
description = "Build the Go runner binary"
dir = "apps/runner"
run = "go build -ldflags=\"-s -w -X beep-runner/internal/version.Version=$(cat ../../VERSION)\" -o ../../bin/beep-runner ."

[tasks."runner:test"]
description = "Run Go runner unit tests"
dir = "apps/runner"
run = "go test -v ./..."

[tasks."locale:sort"]
description = "Sort message keys alphabetically in all locale JSON files"
run = "node scripts/locale-sort-keys.ts"

[tasks."locale:check"]
description = "Verify en/zh key parity and message values"
run = "node scripts/locale-check-keys.ts"

[tasks."locale:compile"]
description = "Compile Paraglide runtime for web"
run = "pnpm --filter web locale:compile"

[tasks.dev]
description = "Start core and web development servers"
run = "bash scripts/dev.sh"

[tasks.core]
description = "Run common core rails commands (interactive)"
env = { RAILS_ENV = "development" }
run = "bash scripts/core.sh"
