[tools]
ruby = "3.4.7"
node = "24.17.0"
pnpm = "10.14.0"
go = "1.27.0"
gum = "0.17.0"
overmind = "2.5.1"
tmux = "3.7b"

[env]
# `.env` then `.env.local` (later file wins).
_.file = [".env", ".env.local"]
# Overmind Overload()'s `.env` and would wipe `.env.local` (empty VITE_CORE_URL=).
OVERMIND_SKIP_ENV = "1"

[tasks.setup]
description = "Set up the development environment (gems, deps, db)"
run = "bash scripts/setup.sh"

[tasks.clean]
description = "Clean logs, caches and local env files (interactive)"
run = "bash scripts/clean.sh"

[tasks.bump]
description = "Bump version across all components (patch | minor | major | X.Y.Z)"
run = "bash scripts/bump.sh"

[tasks."core:dev"]
description = "Start the Rails development server"
dir = "core"
env = { RUBY_DEBUG_OPEN = "true", RUBY_DEBUG_LAZY = "true" }
run = "bin/rails server -p ${CORE_PORT}"

[tasks."core:console"]
description = "Open the Rails console"
dir = "core"
run = "bin/rails console"

[tasks."core:console:production"]
description = "Open the Rails console in the production container"
run = "bash scripts/rails-console-production.sh"

[tasks."web:dev"]
description = "Start the Vite development server"
dir = "apps/web"
run = "pnpm run dev -- --port ${WEB_PORT}"

[tasks."web:build"]
description = "Build the web app for production"
dir = "apps/web"
run = "pnpm run build"

[tasks."cli:build"]
description = "Build the Go beep CLI binary for production"
dir = "apps/cli"
run = """
go build -ldflags="-s -w \
  -X beep/internal/version.Version=$(cat ../../VERSION) \
  -X beep/internal/version.GitCommit=$(git rev-parse --short HEAD) \
  -X beep/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
  -o ../../bin/beep .
"""

[tasks."cli:build:local"]
description = "Build the Go beep CLI binary for local development"
dir = "apps/cli"
run = """
go build -ldflags="-s -w \
  -X beep/internal/version.Version=$(cat ../../VERSION) \
  -X beep/internal/version.GitCommit=$(git rev-parse --short HEAD) \
  -X beep/internal/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
  -X beep/internal/config.DefaultWorkspaceName=.beep.local \
  -X beep/internal/config.DefaultServerURL=http://core.${APP_HOST:-beep.localhost}:${CORE_PORT:-3001}" \
  -o ../../bin/beep-local .
"""

[tasks."cli:test"]
description = "Run Go CLI unit tests"
dir = "apps/cli"
run = "go test -v ./..."

[tasks."cli:workspace:link"]
description = "Symlink a beep workspace to .beep in the current repo"
usage = '''
arg "[workspace]" help="Workspace directory to link" default=""
'''
run = "bash scripts/cli-workspace-link.sh \"${usage_workspace:-}\" .beep"

[tasks."cli:workspace:link:local"]
description = "Symlink a beep workspace to .beep.local in the current repo"
usage = '''
arg "[workspace]" help="Workspace directory to link" default=""
'''
run = "bash scripts/cli-workspace-link.sh \"${usage_workspace:-}\" .beep.local"

[tasks."cli:workspace:unlink"]
description = "Unlink .beep workspace symlink from the current repo"
run = "bash scripts/cli-workspace-unlink.sh .beep"

[tasks."cli:workspace:unlink:local"]
description = "Unlink .beep.local workspace symlink from the current repo"
run = "bash scripts/cli-workspace-unlink.sh .beep.local"

[tasks."locale:sort"]
description = "Sort message keys alphabetically in all locale JSON files"
run = "node scripts/locale-sort-keys.ts"

[tasks."locale:check"]
description = "Verify en/zh key parity and message values"
run = "node scripts/locale-check-keys.ts"

[tasks."locale:compile"]
description = "Compile Paraglide runtime for web"
run = "pnpm --filter web locale:compile"

[tasks.dev]
description = "Start core and web development servers"
run = "bash scripts/dev.sh"

[tasks.core]
description = "Run common core rails commands (interactive)"
env = { RAILS_ENV = "development" }
run = "bash scripts/core.sh"
