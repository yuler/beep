name: Core CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.321.0
        with:
          bundler-cache: true
          working-directory: core

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.321.0
        with:
          bundler-cache: true
          working-directory: core

      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('core/.ruby-version', 'core/**/.rubocop.yml', 'core/**/.rubocop_todo.yml', 'core/Gemfile.lock') }}
        with:
          path: core/${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core

    # services:
    # postgres:
    #   image: postgres
    #   env:
    #     POSTGRES_USER: postgres
    #     POSTGRES_PASSWORD: postgres
    #   ports:
    #     - 5432:5432
    #   options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    # redis:
    #   image: valkey/valkey:8
    #   ports:
    #     - 6379:6379
    #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.321.0
        with:
          bundler-cache: true
          working-directory: core

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Run tests
        env:
          RAILS_ENV: test
          # DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test

  system-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core

    # services:
    # postgres:
    #   image: postgres
    #   env:
    #     POSTGRES_USER: postgres
    #     POSTGRES_PASSWORD: postgres
    #   ports:
    #     - 5432:5432
    #   options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    # redis:
    #   image: valkey/valkey:8
    #   ports:
    #     - 6379:6379
    #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1.321.0
        with:
          bundler-cache: true
          working-directory: core

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: Run System Tests
        env:
          RAILS_ENV: test
          # DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/core/tmp/screenshots
          if-no-files-found: ignore
